name: APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: SDK-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Foto-Aufraeumer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Foto-Aufraeumer
          path: Foto-Aufraeumer.apk

      - name: Als Release veröffentlichen (Download am Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Foto-Aufräumer 1.0.${{ github.run_number }}
          body: APK herunterladen und auf dem Handy öffnen, um sie zu installieren.
          files: Foto-Aufraeumer.apk
